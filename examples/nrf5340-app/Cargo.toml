[package]
name = "thunders-app"
version = "0.1.0"
edition = "2021"
description = "thunders host on the nRF5340 application core (IPC to the net core)"
publish = false

[dependencies]
thunders = { path = "../../thunders", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.11.0", features = ["nrf5340-app-s", "rt", "time-driver-rtc1"] }
nrf-pac = { version = "0.4.0", default-features = false, features = ["nrf5340-app"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[[bin]]
name = "thunders-app"
path = "src/main.rs"
