# cargo-make workflow for the nRF5340 host/controller split.
#
#   cargo make run         -> ONE shot: flash the app core + run + stream RTT
#                            (the net core's flash persists; it boots on reset)
#   cargo make flash-net   -> flash the net core (only when its code changed)
#   cargo make flash       -> flash-net then run (the full 2-core deploy)
#   cargo make hex         -> merge both ELFs into one Intel HEX image (production)
#
# Role pairing (the phase-lock is peripheral-only and was verified on the
# nRF5340): the 5340 NET core runs as PERIPHERAL (follower), and the radio
# PEER is an nRF52840 running the CENTRAL (time master) role.
#
# Run from examples/nrf5340-app/.

[env]
CHIP = "nRF5340_xxAA"
# The debug probe (the nRF5340's DAPLink). Override: cargo make --env PROBE=...
PROBE = "0d28:0204-3:13040003001100e10465599500004fca0000000097969921"
NET_ELF = "../nrf5340/mpsl/target/thumbv8m.main-none-eabi/release/thunders-mpsl"
APP_ELF = "target/thumbv8m.main-none-eabihf/release/thunders-app"
MERGED_HEX = "/tmp/nrf5340_merged.hex"

[tasks.default]
alias = "run"

[tasks.build]
description = "Build both the net-core and app-core firmware"
dependencies = ["build-net", "build-app"]

[tasks.build-net]
command = "cargo"
args = ["build", "--release", "--manifest-path", "../nrf5340/mpsl/Cargo.toml", "--no-default-features", "--features", "peripheral"]

[tasks.build-app]
command = "cargo"
args = ["build", "--release"]

[tasks.run]
description = "Flash the app core + run + stream RTT (one probe-rs shot)"
dependencies = ["build-app"]
command = "probe-rs"
args = ["run", "--chip", "${CHIP}", "--probe", "${PROBE}", "--allow-erase-all", "${APP_ELF}"]

[tasks.flash-net]
description = "Flash the net core (persists until re-flashed)"
dependencies = ["build-net"]
command = "probe-rs"
args = ["download", "--chip", "${CHIP}", "--probe", "${PROBE}", "--allow-erase-all", "${NET_ELF}"]

[tasks.flash]
description = "Full 2-core deploy: flash the net core, then run the app core"
dependencies = ["flash-net", "run"]

[tasks.hex]
description = "Merge both ELFs into a single Intel HEX image (app@0x00000000 + net@0x01000000)"
dependencies = ["build"]
script_runner = "@shell"
script = '''
objcopy -O ihex "${APP_ELF}" /tmp/nrf5340_app.hex
objcopy -O ihex "${NET_ELF}" /tmp/nrf5340_net.hex
# Drop the app image's EOF record, then append the net image (addresses don't overlap).
{ head -n -1 /tmp/nrf5340_app.hex; cat /tmp/nrf5340_net.hex; } > "${MERGED_HEX}"
echo "merged ${MERGED_HEX}: $(wc -l < "${MERGED_HEX}") records"
'''
