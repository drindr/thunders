[package]
name = "thunders-bare"
version = "0.1.0"
edition = "2021"
description = "thunders OneWayState transmitter smoke test on nRF54LM20"
publish = false

[dependencies]
thunders = { path = "../../../thunders", features = ["defmt"] }
thunders-phy-nrf = { path = "../../../thunders-phy-nrf", features = ["nrf54l20", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.11.0", features = ["nrf54lm20-app-s", "rt", "time-driver-grtc"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[features]
default = []
hopping = []

[[bin]]
name = "thunders-bare"
path = "src/main.rs"

[[bin]]
name = "tdma-receiver"
path = "src/bin/tdma_receiver.rs"

[patch.crates-io]
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", rev = "712c715944f338d841043c7f4d20add67449bc94" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "712c715944f338d841043c7f4d20add67449bc94" }

[profile.release]
debug = 2
