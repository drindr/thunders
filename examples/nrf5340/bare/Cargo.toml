[package]
name = "thunders-bare"
version = "0.1.0"
edition = "2021"
description = "thunders link over the raw RADIO backend - role-agnostic (central or peripheral)"
publish = false

[dependencies]
thunders = { path = "../../../thunders", features = ["defmt"] }
thunders-phy-nrf = { path = "../../../thunders-phy-nrf", features = ["nrf5340-net", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.11.0", features = ["nrf5340-net", "rt", "time-driver-rtc1"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "1.2"

[features]
default = ["central", "host"]
central = []
peripheral = []
# The app-core mailbox integration (the host/controller split). Disable for
# the standalone radio bench: without the host's SPU config the mailbox RAM
# is secure and the net core faults on it.
host = []
secure = ["thunders/secure"]
radio-1m = []
ratio-8-4-4 = []
ratio-6-2-2 = []
ratio-4-2-2 = []

[[bin]]
name = "thunders-bare"
path = "src/main.rs"

