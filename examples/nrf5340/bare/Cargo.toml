[package]
name = "thunders-bare"
version = "0.1.0"
edition = "2021"
description = "Raw TDMA sender 1 on the nRF5340 network core"
publish = false

[dependencies]
thunders = { path = "../../../thunders", features = ["defmt"] }
thunders-phy-nrf = { path = "../../../thunders-phy-nrf", features = ["nrf5340-net", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-nrf = { version = "0.11.0", features = ["nrf5340-net", "rt", "time-driver-rtc1"] }
nrf-pac = { version = "0.4.0", default-features = false, features = ["nrf5340-net"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[[bin]]
name = "tdma-sender"
path = "src/main.rs"

[profile.release]
debug = 2
