[package]
name = "thunders-mpsl"
version = "0.1.0"
edition = "2021"
description = "thunders link over MPSL timeslots (nRF5340 net core) - role-agnostic (central or peripheral)"
publish = false

[dependencies]
heapless = "0.9.3"
thunders = { path = "../../../thunders", features = ["defmt"] }
thunders-phy-nrf = { path = "../../../thunders-phy-nrf", features = ["nrf5340-net", "mpsl", "defmt"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = ["nrf5340-net", "critical-section-impl"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.1"
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.11.0", features = ["nrf5340-net", "rt", "time-driver-rtc1"] }
cortex-m = { version = "0.7" }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "1.2"

[features]
default = ["central", "host"]
central = []
peripheral = []
radio-1m = []
pll-fixed = ["thunders-phy-nrf/pll-fixed"]
pll-probe-freeze = ["thunders-phy-nrf/pll-probe-freeze"]
pll-sync-servo = ["thunders-phy-nrf/pll-sync-servo"]
probe-lead-3 = ["thunders/probe-lead-3"]
probe-lead-4 = ["thunders/probe-lead-4"]
cadence-fast = ["thunders/cadence-fast"]
cadence-probe = []
cadence-hold = []
cadence-step-5 = []
cadence-step-10 = []
payload-1 = []
payload-4 = []
payload-16 = []
payload-32 = []
ratio-8-4-4 = []
ratio-6-2-2 = []
ratio-4-2-2 = []
# The app-core mailbox integration (the host/controller split). Disable for
# the standalone radio bench: without the host's SPU config the mailbox RAM
# is secure and the net core faults on it.
host = []

[[bin]]
name = "thunders-mpsl"
path = "src/main.rs"


[profile.release]
debug = 2
