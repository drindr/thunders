[package]
name = "thunders-bare"
version = "0.1.0"
edition = "2021"
description = "thunders OneWayState receiver smoke test on nRF52833"
publish = false

[dependencies]
thunders = { path = "../../../thunders", features = ["defmt"] }
thunders-phy-nrf = { path = "../../../thunders-phy-nrf", features = ["nrf52833", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.11.0", features = ["nrf52833", "rt", "time-driver-rtc1"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[features]
default = []
hopping = []

[[bin]]
name = "thunders-bare"
path = "src/main.rs"

[[bin]]
name = "tdma-sender"
path = "src/bin/tdma_sender.rs"

