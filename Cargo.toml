[workspace]
members = [
    "thunders",
    "thunders-phy-nrf",
    "thunders-phy-external",
    "examples/*",
]
exclude = ["examples/nrf5340-net", "examples/nrf5340", "examples/nrf54lm20"]
resolver = "2"

[workspace.dependencies]
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
heapless = "0.9.3"
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-executor = "0.10.0"
embassy-nrf = "0.11.0"
embedded-hal-async = "1.0"
embassy-futures = "0.1.1"
defmt = "0.3"
